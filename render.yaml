services:
  - type: web
    name: mns-backend
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://mns.studio,https://www.mns.studio,https://app.mns.studio
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: MNS Studio <noreply@mns.studio>
      - key: FINALIZED_REPORT_RECIPIENT
        value: john@mns.studio
