<!--
  Paste into Supabase → Authentication → Email Templates → "Invite user"
  Required merge tag: {{ .ConfirmationURL }}
  Suggested subject: You've been invited to MNS Studio
-->
<div style="background:#f9f5ee;padding:32px 16px;font-family:Georgia,'Times New Roman',serif;color:#2f2a24;">
  <div style="max-width:480px;margin:0 auto;background:#fffdf9;border:1px solid #e8e0d0;border-radius:10px;padding:32px;">
    <img src="https://www.mns.studio/icons/icon-512.png" width="48" height="48" alt="MNS Studio" style="border-radius:10px;margin:0 0 20px;display:block;">
    <h1 style="margin:0 0 10px;font-size:22px;font-weight:normal;">You're invited to MNS Studio</h1>
    <p style="margin:0 0 24px;color:#5b544a;font-size:15px;line-height:1.5;">
      Click below to accept your invitation and set up your account.
    </p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#6e8d67;color:#fffdf9;text-decoration:none;font-weight:600;font-size:15px;padding:12px 32px;border-radius:999px;">
      Accept invite
    </a>
    <p style="margin:24px 0 0;color:#8a8272;font-size:13px;line-height:1.5;">
      Or paste this link into your browser:<br>
      <a href="{{ .ConfirmationURL }}" style="color:#8a8272;word-break:break-all;">{{ .ConfirmationURL }}</a>
    </p>
    <p style="margin:24px 0 0;font-size:14px;color:#8a8272;">— MNS Studio · <a href="https://mns.studio" style="color:#8a8272;">mns.studio</a></p>
  </div>
</div>
