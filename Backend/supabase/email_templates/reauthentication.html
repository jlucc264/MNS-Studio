<!--
  Paste into Supabase → Authentication → Email Templates → "Reauthentication"
  Required merge tag: {{ .Token }}  (a 6-digit code, not a link)
  Suggested subject: Your MNS Studio verification code
-->
<div style="background:#f9f5ee;padding:32px 16px;font-family:Georgia,'Times New Roman',serif;color:#2f2a24;">
  <div style="max-width:480px;margin:0 auto;background:#fffdf9;border:1px solid #e8e0d0;border-radius:10px;padding:32px;">
    <img src="https://www.mns.studio/icons/icon-512.png" width="48" height="48" alt="MNS Studio" style="border-radius:10px;margin:0 0 20px;display:block;">
    <h1 style="margin:0 0 10px;font-size:22px;font-weight:normal;">Confirm it's you</h1>
    <p style="margin:0 0 20px;color:#5b544a;font-size:15px;line-height:1.5;">
      Enter this code to confirm this sensitive action on your MNS Studio account.
    </p>
    <div style="display:inline-block;background:#f5f1ea;border:1px solid #e4ddd5;border-radius:10px;padding:14px 28px;font-size:28px;letter-spacing:6px;font-weight:bold;color:#3f382f;">
      {{ .Token }}
    </div>
    <p style="margin:20px 0 0;color:#8a8272;font-size:13px;line-height:1.5;">
      Didn't request this? You can safely ignore this email.
    </p>
    <p style="margin:24px 0 0;font-size:14px;color:#8a8272;">— MNS Studio · <a href="https://mns.studio" style="color:#8a8272;">mns.studio</a></p>
  </div>
</div>
